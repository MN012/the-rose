<title>The Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a website. Sticky header with nav, wide content area with two-column pages on desktop, a footer. Still big tap targets and one column on phones. */
:root {
  /* Luxury: one warm espresso palette, used in both light and dark system settings */
  --bg: #1F1A16; --card: #27211C; --ink: #EDE6DC; --muted: #A79C8E; --rose: #D9A0AE; --rose-ink: #1F1A16; --rose-soft: #3A2A2C;
  --ok: #9CC8B2; --ok-soft: #22302A; --warn: #E2BE7A; --warn-soft: #3A2F1C; --rule: rgba(237, 230, 220, .14); --stage: #2C251F;
  --shadow: none; color-scheme: dark;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Archivo", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1A16; --card: #27211C; --ink: #EDE6DC; --muted: #A79C8E; --rose: #D9A0AE; --rose-ink: #1F1A16; --rose-soft: #3A2A2C;
  --ok: #9CC8B2; --ok-soft: #22302A; --warn: #E2BE7A; --warn-soft: #3A2F1C; --rule: rgba(237, 230, 220, .14); --stage: #2C251F;
  --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1A16; --card: #27211C; --ink: #EDE6DC; --muted: #A79C8E; --rose: #D9A0AE; --rose-ink: #1F1A16; --rose-soft: #3A2A2C;
  --ok: #9CC8B2; --ok-soft: #22302A; --warn: #E2BE7A; --warn-soft: #3A2F1C; --rule: rgba(237, 230, 220, .14); --stage: #2C251F;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--rose); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 760px) { .wrap { padding-inline: 32px; } }

.site-head { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.site-head .wrap { display: flex; align-items: center; gap: 20px; min-height: 68px; flex-wrap: wrap; }
.brandmark { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 24px; text-decoration: none; color: var(--ink); }
.brandmark svg { width: 26px; height: 26px; color: var(--rose); }
.site-nav { display: flex; gap: 4px; flex: 1; justify-content: center; }
.site-nav a { text-decoration: none; color: var(--ink); font-weight: 600; font-size: 16px; padding: 10px 14px; border-radius: 999px; white-space: nowrap; }
.site-nav a:hover { background: var(--card); }
.site-nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.sample { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 4px 8px; border-radius: 4px; white-space: nowrap; flex: none; }
@media (max-width: 899px) {
  .site-head .wrap { gap: 0 12px; padding-top: 6px; }
  .brandmark { flex: 1; }
  .site-nav { order: 3; flex-basis: 100%; justify-content: flex-start; overflow-x: auto; margin-inline: -16px; padding: 4px 16px 10px; scrollbar-width: none; }
  .site-nav a { font-size: 15px; padding: 8px 12px; }
}

main { display: grid; gap: 28px; padding-block: 28px 64px; }
@media (min-width: 760px) { main { gap: 40px; padding-block: 40px 88px; } }
.crumbs { font-size: 14.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: -12px; }
.crumbs a { color: var(--muted); }
.h1 { font-family: var(--display); font-weight: 600; font-size: clamp(32px, 6vw, 52px); line-height: 1.06; }
.h2 { font-family: var(--display); font-weight: 600; font-size: clamp(25px, 3.2vw, 32px); line-height: 1.15; }
.page-head { display: grid; gap: 12px; max-width: 720px; }

.split { display: grid; gap: 24px; min-width: 0; }
.split > * { min-width: 0; }
.col { display: grid; gap: 20px; align-content: start; min-width: 0; }
.grid3, .grid5, .grid4 { display: grid; gap: 16px; }
@media (min-width: 760px) {
  .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .btn.auto { width: auto; }
}
@media (min-width: 900px) {
  .split { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start; }
  .split.side { grid-template-columns: 360px minmax(0, 1fr); }
  .split.wide { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .sticky { position: sticky; top: 96px; }
}

.hero { display: grid; gap: 28px; align-items: center; }
.hero .h1 { font-size: clamp(38px, 7vw, 72px); }
.hero-pics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero-pics .pic { aspect-ratio: 3/4; border-radius: 16px; overflow: hidden; }
.hero-pics .pic:nth-child(2) { margin-top: 40px; }
@media (min-width: 900px) { .hero { grid-template-columns: 1.15fr 1fr; gap: 56px; } }
.band { background: var(--card); border-block: 1px solid var(--rule); }
.band main { padding-block: 40px; }
.steps { counter-reset: s; }
.steps .card::before { counter-increment: s; content: counter(s); font-family: var(--display); font-size: 34px; font-weight: 600; color: var(--rose); line-height: 1; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

.site-foot { border-top: 1px solid var(--rule); background: var(--card); font-size: 15px; }
.site-foot .wrap { display: grid; gap: 28px; padding-block: 40px; }
@media (min-width: 760px) { .site-foot .wrap { grid-template-columns: 1.4fr 1fr 1fr 1fr; } }
.site-foot h4 { margin: 0 0 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.site-foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.site-foot a { color: var(--ink); text-decoration: none; }
.site-foot a:hover { text-decoration: underline; }
.site-foot .fine { grid-column: 1 / -1; border-top: 1px solid var(--rule); padding-top: 16px; color: var(--muted); font-size: 13.5px; }
.label { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 17px; }
.small { font-size: 14.5px; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.section { display: grid; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }

.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 14px 20px; border-radius: 12px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 18px; cursor: pointer; text-decoration: none; text-align: center; width: 100%; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.rose { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); }
.btn.line { background: transparent; color: var(--ink); }
.btn.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); cursor: default; }
.btn.sm { min-height: 48px; font-size: 16px; padding: 10px 16px; }
.btn:disabled { opacity: .55; cursor: default; }
.link { background: none; border: 0; padding: 8px 0; color: var(--rose); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-size: 16px; text-align: left; }

.big-actions { display: grid; gap: 12px; }
.big { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: center; text-align: left; min-height: 96px; padding: 18px; border-radius: 16px; border: 2px solid var(--ink); background: var(--card); cursor: pointer; box-shadow: var(--shadow); }
.big.primary { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); }
.big .ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--bg); color: var(--ink); }
.big.primary .ico { background: rgba(255,255,255,.18); color: var(--rose-ink); }
.big .ico svg { width: 28px; height: 28px; }
.big b { display: block; font-size: 21px; line-height: 1.2; }
.big span { font-size: 15px; opacity: .85; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--rule); }
.chip.match { background: var(--rose-soft); border-color: transparent; color: var(--ink); }
.chip.new { background: var(--ok-soft); border-color: var(--ok); }

.avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 32px; color: #fff; flex: none; }
.avatar.sm { width: 48px; height: 48px; font-size: 21px; }
.who { display: flex; align-items: center; gap: 16px; }
.who .h1 { font-size: 34px; }

.badge { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.badge:last-child { border-bottom: 0; padding-bottom: 0; }
.badge .seal { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--rose-soft); color: var(--rose); }
.badge .seal svg { width: 22px; height: 22px; }
.badge b { display: block; font-size: 16.5px; line-height: 1.25; }
.badge small { font-size: 13.5px; color: var(--muted); }
.status { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.status.ver { background: var(--ok-soft); color: var(--ok); }
.status.pend { background: var(--warn-soft); color: var(--warn); }
.badge.fresh { animation: pop .6s ease; }
@keyframes pop { 0% { transform: scale(.96); background: var(--ok-soft); } 100% { transform: none; background: transparent; } }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 56px; height: 32px; border-radius: 999px; background: var(--rule); position: relative; flex: none; transition: background .2s; border: 1px solid var(--rule); }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(24px); }
.switch input:focus-visible + .track { outline: 3px solid var(--rose); outline-offset: 2px; }

.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.thumb { display: grid; gap: 6px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.thumb .pic { aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; }
.thumb b { font-size: 15px; line-height: 1.3; }
.pic { background: var(--stage); position: relative; display: grid; place-items: center; text-align: center; max-width: 100%; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pic .ph { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px; }

.item { display: grid; gap: 10px; }
.item-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.item-head b { font-size: 18px; line-height: 1.25; display: block; }
.meta { font-size: 14.5px; color: var(--muted); }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.facts div { padding: 12px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.facts div:nth-child(odd) { padding-right: 12px; }
.facts div:nth-child(even) { padding-left: 12px; border-left: 1px solid var(--rule); }
.facts span { font-size: 13px; color: var(--muted); }
.facts b { font-size: 16.5px; }
.kpi-row b { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }

.story { border-left: 3px solid var(--rose); padding-left: 16px; font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1.45; }
.private { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 15px; background: var(--bg); padding: 14px; border-radius: 10px; }
.private svg { width: 22px; height: 22px; flex: none; }

.kpis { display: grid; gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.kpi b { font-family: var(--display); font-weight: 600; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi b small { font-family: var(--body); font-size: 20px; font-weight: 600; margin-left: 4px; }
.kpi span { font-size: 17px; font-weight: 600; }
.kpi em { font-style: normal; font-size: 14px; color: var(--ok); font-weight: 600; min-height: 1.4em; }
.kpi.bump { animation: bump 1s ease; }
@keyframes bump { 0%, 100% { transform: none; } 30% { transform: scale(1.03); border-color: var(--ok); } }

.rows { display: grid; }
.rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 15.5px; }
.rows > div:last-child { border-bottom: 0; }
.rows .num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

form { display: grid; gap: 18px; }
.field { display: grid; gap: 8px; }
.field label { font-weight: 600; font-size: 16px; }
.field .hint { font-size: 14px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--rule); background: var(--card); font-size: 17px; }
.field input:focus, .field select:focus { border-color: var(--rose); outline: none; }
.err { color: var(--rose); font-size: 14.5px; font-weight: 600; min-height: 1.2em; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 2px solid var(--rule); border-radius: 999px; cursor: pointer; font-size: 15px; font-weight: 500; }
.checks input { width: 18px; height: 18px; accent-color: var(--rose); }
.checks label:has(input:checked) { border-color: var(--rose); background: var(--rose-soft); }

.seg { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.seg button { flex: none; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--rule); background: var(--card); cursor: pointer; font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.lesson-pt { display: grid; grid-template-columns: 32px 1fr; gap: 12px; }
.lesson-pt i { font-style: normal; width: 32px; height: 32px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opts button { min-height: 56px; text-align: left; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--rule); background: var(--card); cursor: pointer; font-size: 16.5px; }
.opts button.wrong { border-color: var(--rose); background: var(--rose-soft); }
.opts button.right { border-color: var(--ok); background: var(--ok-soft); }

.qrwrap { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; }
.qrbox { background: #fff; padding: 8px; border-radius: 8px; }
.qrbox svg { width: 100%; height: auto; display: block; }
.url { font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--muted); }
.tags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tag { background: #fff; color: #171B24; border-radius: 10px; padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; border: 1px solid var(--rule); }
.tag b { font-family: var(--display); font-size: 16px; }
.tag small { font-family: var(--mono); font-size: 11px; color: #555D6B; }

.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; }
@media (min-width: 760px) { .shop { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px; } .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .shop.five { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.product { display: grid; gap: 8px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.product .pic { aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; transition: transform .25s ease; }
.product:hover .pic { transform: translateY(-3px); }
.product b { font-size: 17px; line-height: 1.3; }
.product .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; color: var(--muted); }
.product .row span:first-child { font-family: var(--mono); color: var(--ink); }

.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 16, .5); display: grid; align-items: end; justify-items: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .sheet-bg { align-items: center; } }
.sheet { width: 100%; max-width: 488px; background: var(--card); border-radius: 20px; padding: 24px 20px 20px; display: grid; gap: 14px; box-shadow: 0 30px 60px rgba(0,0,0,.4); animation: up .25s ease; max-height: 85vh; overflow-y: auto; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet .done-ico { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.sheet .done-ico svg { width: 34px; height: 34px; }
.sheet .h2 { font-size: 27px; }

.who-for { display: grid; gap: 0; }
.who-for div { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.who-for div:last-child { border-bottom: 0; }
.who-for b { font-weight: 700; }
.who-for span { color: var(--muted); }
.foot-note { text-align: center; font-size: 13px; color: var(--muted); padding-top: 8px; }

/* Editorial finish: paper tones, sharp corners, hairlines instead of shadows, italic rose accents */
.announce { background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 9px 16px; }
.card, .kpi { border-radius: 6px; box-shadow: none; }
.big { border-radius: 6px; border-width: 1px; border-color: var(--rule); box-shadow: none; min-height: 112px; transition: transform .2s ease, border-color .2s ease; }
.big:hover { transform: translateY(-2px); border-color: var(--ink); }
.big.primary { border-color: var(--rose); }
.big .ico { border-radius: 50%; }
.btn { border-radius: 999px; font-size: 17px; }
.btn.line { border-width: 1px; }
.pic, .product .pic, .hero-pics .pic, .thumb .pic { border-radius: 3px !important; }
.h1 em, .h2 em { font-style: italic; color: var(--rose); font-weight: 500; }
.hero .h1 { font-size: clamp(46px, 8.4vw, 100px); line-height: .98; letter-spacing: -.01em; }
.hero-pics .pic { box-shadow: 0 30px 60px -30px rgba(26, 23, 20, .45); }
.label { letter-spacing: .14em; }
.sec-head { border-bottom: 1px solid var(--ink); padding-bottom: 12px; }
.sec-head .h2 { font-size: clamp(28px, 4vw, 44px); }
.page-head .h1 { font-size: clamp(40px, 6.4vw, 72px); }
.pic:has(.ph) { background: linear-gradient(160deg, var(--stage), var(--card)); }
.pic .ph { display: grid; gap: 8px; justify-items: center; font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.2; letter-spacing: 0; text-transform: none; color: var(--ink); padding: 16px; }
.pic .ph svg { width: 36px; height: 36px; color: var(--rose); }
.pic .ph small { font-family: var(--mono); font-style: normal; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tagchip { position: absolute; top: 10px; left: 10px; z-index: 1; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; background: rgba(251, 249, 244, .94); color: #1A1714; padding: 4px 8px; border-radius: 2px; }
.product .maker { font-size: 14px; color: var(--muted); margin-top: -4px; }
.product b { font-family: var(--display); font-size: 20px; font-weight: 600; }

const NAV_FOR = { home: "home", maker: "maker", matches: "maker", lessons: "maker", lesson: "maker", garments: "garments", garment: "garments", donate: "donate", dashboard: "dashboard", trainer: "trainer" };
function header(cur) {
  const link = (key, href, label) => `<a href="#${href}"${cur === key ? ' aria-current="page"' : ""}>${label}</a>`;
  return `<div class="wrap">
    <a class="brandmark" href="#home">${icon("rose")}The Rose</a>
    <nav class="site-nav" aria-label="Main">
      ${link("maker", `maker-${S.me}`, "Makers")}
      ${link("garments", "garments", "Collection")}
      ${link("donate", "donate", "For brands")}
      ${link("dashboard", "dashboard", "Impact")}
    </nav>
    <span class="sample">Sample data</span>
  </div>`;
}
function footer() {
  return `<div class="wrap">
    <div class="stack" style="gap:8px"><a class="brandmark" href="#home">${icon("rose")}The Rose</a><p class="small">Fashion waste, remade by hand in London by people building a fresh start.</p></div>
    <div><h4>Explore</h4><ul><li><a href="#garments">Collection</a></li><li><a href="#dashboard">Impact</a></li><li><button class="link" style="padding:0;font-size:15px;font-weight:400;color:var(--ink);text-decoration:none" data-act="scan">Scan a garment</button></li></ul></div>
    <div><h4>Join in</h4><ul><li><a href="#maker-${S.me}">I'm a maker</a></li><li><a href="#donate">Donate fabric</a></li><li><a href="#trainer">Trainer area</a></li></ul></div>
    <div><h4>Support</h4><ul>${SUPPORT.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a></li>`).join("")}</ul></div>
    <div class="wordmark" aria-hidden="true">The Rose</div>
    <p class="fine">Sample data. All people, brands and numbers on this site are examples for a demo.</p>
  </div>`;
}
function route() {
  const h = (location.hash || "#home").slice(1);
  const [name, ...rest] = h.split("-");
  const arg = rest.join("-");
  let html;
  switch (name) {
    case "trainer": html = viewTrainer(); break;
    case "maker": html = viewMaker(arg || S.me); break;
    case "matches": html = viewMatches(); break;
    case "lessons": html = viewLessons(); break;
    case "lesson": html = viewLessons(arg); break;
    case "garments": html = viewGarments(); break;
    case "garment": html = viewGarment(arg); break;
    case "donate": html = viewDonate(); break;
    case "dashboard": html = viewDashboard(); break;
    default: html = viewHome();
  }
  $("app").innerHTML = html;
  $("head").innerHTML = header(NAV_FOR[name] || "home");
  $("foot").innerHTML = footer();
  if (S.flash) { S.flash = null; save(); }
  window.scrollTo(0, 0);
}
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
window.addEventListener("hashchange", route);

/* ============================================================
   ACTIONS
   ============================================================ */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === "close-sheet") {
    if (a.classList.contains("sheet-bg") && e.target !== a) return;
    $("sheet-root").innerHTML = "";
    if (a.dataset.next) go(a.dataset.next);
    return;
  }
  if (act === "back") { if (history.length > 1) history.back(); else go("home"); }
  if (act === "scan") scanSheet();
  if (act === "tsel") { S.trainerSel = id; save(); route(); }
  if (act === "verify") {
    const b = S.makers[id].badges[+a.dataset.i];
    b.verified = true; b.by = TRAINER; b.date = today();
    if (!S.makers[id].skills.includes(b.skill)) S.makers[id].skills.push(b.skill);
    save(); route();
    sheet("Badge verified", `“${esc(b.name)}” is now verified on ${esc(S.makers[id].name)}'s Maker Passport.`, "See passport", `maker-${id}`);
  }
  if (act === "me") { S.me = id; save(); go(`maker-${id}`); }
  if (act === "book") {
    const x = MENTORS.find(m => m.id === id);
    S.booked[id] = true; S.flash = "hours"; save(); route();
    sheet(`Booked with ${x.name}`, `Your first session is on ${x.slot}. ${x.name} will meet you at your workshop. One mentoring hour has been added to the impact dashboard.`);
  }
  if (act === "contact") {
    const x = JOBS.find(j => j.id === id);
    S.contacted[id] = true; save(); route();
    sheet("Request sent", `We sent ${esc(S.makers[S.me].name)}'s Maker Passport to the ${x.org.split(",")[0].toLowerCase()} for the ${x.title.toLowerCase()} role. They will reply through your trainer.`);
  }
  if (act === "answer") {
    const l = LESSONS.find(x => x.id === a.dataset.l), i = +a.dataset.i;
    if (S.lessons[l.id]) return;
    if (i !== l.answer) { a.classList.add("wrong"); $("ans-msg").textContent = "Not quite. Read the three points again and try once more."; return; }
    a.classList.add("right");
    const m = S.makers[S.me];
    S.lessons[l.id] = true;
    m.badges.push({ name: l.badge, skill: "Money basics", verified: true, by: "Lesson quiz", date: today() });
    const newSkill = !m.skills.includes("Money basics");
    if (newSkill) m.skills.push("Money basics");
    S.flash = l.badge; save();
    setTimeout(() => sheet("New badge earned", `<b>${esc(l.badge)}</b> is now on your Maker Passport.${newSkill ? " You also gained the skill <b>Money basics</b>, which gives you a new mentor match." : ""}`, "See my passport", `maker-${S.me}`), 350);
  }
  if (act === "buy") {
    S.reserved[id] = true; save(); route();
    sheet("Reserved for you", `${esc(GARMENTS[id].name)} is held for 48 hours. We'll send payment and delivery details by email. Your purchase pays ${esc(S.makers[GARMENTS[id].maker].name)}'s wage at the workshop.`, "Donate fabric next", "donate");
  }
  if (act === "reset") { S = fresh(); save(); route(); sheet("Demo reset", "Everything is back to the starting sample data."); }
});

document.addEventListener("change", e => {
  if (e.target.dataset.act === "consent") {
    const m = S.makers[e.target.dataset.id];
    m.consent = e.target.checked; save();
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "donate-form") {
    const brand = $("d-brand").value.trim(), kg = parseFloat($("d-kg").value);
    if (!brand) { $("d-err").textContent = "Please add your brand name."; $("d-brand").focus(); return; }
    if (!(kg > 0)) { $("d-err").textContent = "Please add how many kg you're donating, for example 40."; $("d-kg").focus(); return; }
    const d = { brand, type: $("d-type").value, kg, pickup: $("d-pick").value, date: today() };
    S.donations.push(d); S.flash = "kg"; save();
    sheet(`Thank you, ${esc(brand)}`, `${fmt(kg)} kg of ${esc(d.type.toLowerCase())} is booked for pickup at: ${esc(d.pickup)}. We added it to the impact dashboard.`, "See impact dashboard", "dashboard");
  }
  if (f.id === "maker-form") {
    const name = $("m-name").value.trim();
    if (!/^[A-Za-z\u00C0-\u00FF'-]{2,20}$/.test(name)) { $("m-err").textContent = name.includes(" ") ? "Please use a first name only, with no surname." : "Please enter a first name of 2 to 20 letters."; return; }
    const skills = [...f.querySelectorAll('input[name="sk"]:checked')].map(x => x.value);
    if (!skills.length) { $("m-err").textContent = "Choose at least one skill."; return; }
    const id = name.toLowerCase().replace(/[^a-z]/g, "") + Date.now().toString(36).slice(-3);
    const colors = ["#7A4E9E", "#2F6A8F", "#8F6A2F", "#2F8F6A", "#9E2348"];
    S.makers[id] = { name: name[0].toUpperCase() + name.slice(1), color: colors[S.newMakers % colors.length], since: new Date().toLocaleDateString("en-GB", { month: "long", year: "numeric" }), workshop: $("m-ws").value,
      about: "New maker at The Rose.", skills, badges: [], consent: false, story: "" };
    S.newMakers++; S.trainerSel = id; save(); route();
    sheet("Profile created", `${esc(S.makers[id].name)}'s Maker Passport is ready. Their story stays private until they choose to share it.`, "Open passport", `maker-${id}`);
  }
  if (f.id === "badge-form") {
    const sel = S.trainerSel && S.makers[S.trainerSel] ? S.trainerSel : Object.keys(S.makers)[0];
    const name = $("b-name").value.trim(); if (!name) return;
    const skill = $("b-skill").value, m = S.makers[sel];
    m.badges.push({ name, skill, verified: true, by: TRAINER, date: today() });
    if (!m.skills.includes(skill)) m.skills.push(skill);
    save(); route();
    sheet("Badge added", `“${esc(name)}” is verified on ${esc(m.name)}'s passport.`);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("sheet-root").innerHTML) $("sheet-root").innerHTML = ""; });

route();
</script>
