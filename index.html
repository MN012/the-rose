<title>The Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400&family=Jost:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Minimal and classy, after The Linearity: lots of air, a centred logo, thin uppercase serif headings, hairlines, square corners, very few buttons.
   One brand palette: ivory and oxblood, in both light and dark system settings. */
:root {
  --bg: #FAF8F4; --card: #FFFFFF; --ink: #1B1918; --muted: #6F6A64; --rose: #7A1F33; --rose-ink: #FFFFFF; --rose-soft: #F1E4E4;
  --rule: rgba(27, 25, 24, .14); --stage: #EFECE6;
  --ok: #2F5F4B; --ok-soft: #E3EDE7; --warn: #8A5A00; --warn-soft: #F5EBD6;
  color-scheme: light;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.65; font-weight: 400; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--ink); }
img { display: block; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* ---------- frame ---------- */
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 760px) { .wrap { padding-inline: 40px; } }

.site-head { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.site-head .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 76px; gap: 16px; }
.brandmark { display: grid; justify-items: center; gap: 2px; text-decoration: none; color: var(--ink); font-family: var(--display); font-size: 15px; letter-spacing: .34em; text-transform: uppercase; padding-left: .34em; }
.brandmark svg { width: 24px; height: 24px; color: var(--rose); }
.site-nav { display: flex; gap: 28px; }
.site-nav.right { justify-content: flex-end; }
.site-nav a, .site-nav button { text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; padding: 12px 0; background: none; border: 0; cursor: pointer; transition: color .2s; }
.site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); }
.site-nav a[aria-current="page"] { box-shadow: inset 0 -1px 0 var(--ink); }
.menu-btn, .site-nav .m-only, .mobile-nav { display: none; }
.sample { position: fixed; left: 12px; bottom: 12px; z-index: 40; font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 5px 9px; }

@media (max-width: 899px) {
  .site-head { backdrop-filter: none; background: var(--bg); }
  .site-head .wrap { grid-template-columns: 48px 1fr 48px; min-height: 64px; }
  .site-head .site-nav { display: none; }
  .brandmark { font-size: 13px; }
  .brandmark svg { width: 20px; height: 20px; }
  .menu-btn { display: grid; grid-column: 3; place-items: center; width: 48px; height: 48px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .menu-btn svg { width: 24px; height: 24px; }
  .site-head.open .mobile-nav { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; height: calc(100dvh - 64px); overflow-y: auto; background: var(--bg); padding: 24px 16px 48px; border-top: 1px solid var(--rule); z-index: 30; text-align: center; }
  .mobile-nav a, .mobile-nav button { display: block; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 20px 0; font-family: var(--display); font-size: 26px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); text-decoration: none; cursor: pointer; }
  .mobile-nav a[aria-current="page"] { color: var(--rose); }
  .mobile-nav .m-small { font-family: var(--body); font-size: 12px; letter-spacing: .22em; color: var(--muted); padding: 16px 0; }
  .mobile-nav .m-small:first-of-type { margin-top: 24px; }
  body.menu-open { overflow: hidden; }
}

main { display: grid; gap: 56px; padding-block: 48px 96px; }
@media (min-width: 760px) { main { gap: 96px; padding-block: 72px 140px; } }

.site-foot { border-top: 1px solid var(--rule); text-align: center; }
.site-foot .wrap { display: grid; gap: 28px; justify-items: center; padding-block: 56px 72px; }
.site-foot ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 28px; }
.site-foot a, .site-foot .link { color: var(--muted); text-decoration: none; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }
.site-foot a:hover { color: var(--ink); }
.site-foot .tagline { font-family: var(--display); font-style: italic; font-size: 20px; color: var(--ink); max-width: 520px; }
.site-foot .fine { color: var(--muted); font-size: 13px; }

/* ---------- type ---------- */
.h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4.8vw, 58px); line-height: 1.12; letter-spacing: .05em; text-transform: uppercase; }
.h2 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 2.8vw, 32px); line-height: 1.2; letter-spacing: .06em; text-transform: uppercase; }
.h1 em, .h2 em { font-style: italic; text-transform: none; letter-spacing: 0; color: var(--rose); }
.label { font-size: 11.5px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 18px; line-height: 1.7; }
.small { font-size: 15px; color: var(--muted); }
.stack { display: grid; gap: 14px; }
.section { display: grid; gap: 20px; }
.page-head { display: grid; gap: 16px; justify-items: center; text-align: center; max-width: 720px; margin-inline: auto; }
.page-head .lead { max-width: 600px; }
.crumbs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: -40px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.sec-head { display: grid; justify-items: center; gap: 10px; text-align: center; }
.foot-note { font-size: 13px; color: var(--muted); }

/* ---------- layout ---------- */
.split { display: grid; gap: 32px; min-width: 0; }
.split > * { min-width: 0; }
.col { display: grid; gap: 24px; align-content: start; min-width: 0; }
.grid3, .grid4, .grid5 { display: grid; gap: 20px; }
@media (min-width: 760px) {
  .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .btn.auto { width: auto; padding-inline: 44px; }
}
@media (min-width: 900px) {
  .split { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: start; }
  .split.side { grid-template-columns: 340px minmax(0, 1fr); }
  .split.wide { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .sticky { position: sticky; top: 108px; }
}

/* ---------- controls: few, quiet, square ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 14px 24px; border-radius: 0; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 12.5px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; cursor: pointer; text-decoration: none; text-align: center; width: 100%; transition: background .25s, color .25s; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.rose { background: var(--ink); color: var(--bg); }
.btn.rose:hover { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); }
.btn.line { background: transparent; }
.btn.ok, .btn.ok:hover { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); cursor: default; }
.btn.sm { min-height: 48px; padding: 10px 18px; }
.btn:disabled { cursor: default; }
.link { display: inline-flex; align-items: center; min-height: 44px; background: none; border: 0; padding: 0; color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 8px; cursor: pointer; text-align: left; transition: text-decoration-color .2s; }
.link:hover { text-decoration-color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--rule); padding: 28px; display: grid; gap: 14px; min-width: 0; }
@media (max-width: 599px) { .card { padding: 20px; } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; font-size: 14px; padding: 6px 14px; border: 1px solid var(--rule); border-radius: 999px; }
.chip.match { background: var(--rose-soft); border-color: transparent; }
.chip.new { background: var(--ok-soft); border-color: var(--ok); }

.avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 30px; color: #fff; flex: none; filter: saturate(.55); }
.avatar.sm { width: 48px; height: 48px; font-size: 20px; }
.who { display: flex; align-items: center; gap: 16px; }

.badge { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.badge:last-child { border-bottom: 0; padding-bottom: 0; }
.badge .seal { width: 36px; height: 36px; display: grid; place-items: center; color: var(--rose); border: 1px solid var(--rule); border-radius: 50%; }
.badge .seal svg { width: 18px; height: 18px; }
.badge b { display: block; font-weight: 500; font-size: 16.5px; line-height: 1.3; }
.badge small { font-size: 13.5px; color: var(--muted); }
.status { font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding: 4px 9px; white-space: nowrap; }
.status.ver { background: var(--ok-soft); color: var(--ok); }
.status.pend { background: var(--warn-soft); color: var(--warn); }
.badge.fresh { animation: pop .8s ease; }
@keyframes pop { 0% { background: var(--ok-soft); } 100% { background: transparent; } }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 52px; height: 30px; border-radius: 999px; background: var(--stage); position: relative; flex: none; transition: background .2s; border: 1px solid var(--rule); }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(22px); }
.switch input:focus-visible + .track { outline: 2px solid var(--rose); outline-offset: 2px; }

/* ---------- imagery ---------- */
.pic { background: var(--stage); position: relative; display: grid; place-items: center; text-align: center; overflow: hidden; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
.pic .ph { display: grid; gap: 8px; justify-items: center; font-family: var(--display); font-style: italic; font-size: 20px; padding: 16px; }
.pic .ph svg { width: 32px; height: 32px; color: var(--muted); }
.pic .ph small { font-family: var(--body); font-style: normal; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 16px; }
@media (min-width: 760px) { .shop { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 56px 28px; } }
@media (min-width: 1100px) { .shop.five { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.product { display: grid; gap: 6px; justify-items: center; text-align: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.product .pic { width: 100%; aspect-ratio: 3/4; margin-bottom: 10px; }
.product:hover .pic img { transform: scale(1.04); }
.product b { font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.35; }
.product .maker { font-size: 13.5px; color: var(--muted); }
.product .row { font-size: 14px; color: var(--muted); }

/* ---------- home ---------- */
.hero { display: grid; justify-items: center; text-align: center; gap: 22px; padding-top: 24px; }
.hero .h1 { font-size: clamp(34px, 6.4vw, 78px); max-width: 15ch; }
.hero .lead { max-width: 520px; }
.drop { width: 1px; height: 72px; background: var(--rule); }
.strip { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 16px; align-items: end; margin-top: -40px; }
.strip a { display: block; }
.strip .pic { aspect-ratio: 3/4; }
.strip a:nth-child(2) .pic { aspect-ratio: 4/5; }
.strip a:hover img { transform: scale(1.04); }
@media (max-width: 599px) { .strip { grid-template-columns: 1fr 1fr; } .strip a:nth-child(3) { display: none; } .strip a:nth-child(2) .pic { aspect-ratio: 3/4; } }

.entries { display: grid; border-block: 1px solid var(--rule); }
.entry { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 30px 16px; background: none; border: 0; cursor: pointer; color: var(--ink); transition: background .25s; }
.entry + .entry { border-top: 1px solid var(--rule); }
.entry b { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.entry span { font-size: 14.5px; color: var(--muted); }
.entry i { font-style: normal; font-size: 11.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--rose); margin-top: 6px; }
.entry:hover { background: var(--card); }
@media (min-width: 760px) { .entries { grid-template-columns: repeat(3, 1fr); } .entry + .entry { border-top: 0; border-left: 1px solid var(--rule); } .entry { padding: 44px 24px; } }

.zig { position: relative; display: grid; gap: 64px; }
.zig-row { display: grid; gap: 28px; align-items: center; }
.zig-row .pic { aspect-ratio: 4/5; }
.zig-text { display: grid; gap: 16px; justify-items: center; text-align: center; max-width: 400px; margin-inline: auto; }
.zig-text p { color: var(--muted); }
@media (min-width: 900px) {
  .zig::before { content: ""; position: absolute; left: 50%; top: -48px; bottom: -48px; width: 1px; background: var(--rule); }
  .zig { gap: 0; }
  .zig-row { grid-template-columns: 1fr 1fr; gap: 0; }
  .zig-row .pic { width: 66%; margin-inline: auto; }
  .zig-row:nth-child(even) .pic { order: 2; }
  .zig-row:nth-child(even) .zig-text { order: 1; }
  .zig-row + .zig-row { margin-top: -40px; }
}

.ticker { display: grid; grid-template-columns: repeat(2, 1fr); border-block: 1px solid var(--rule); }
.ticker div { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 28px 8px; }
.ticker div:nth-child(odd) { border-right: 1px solid var(--rule); }
.ticker div:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
.ticker b { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4vw, 46px); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.ticker span { font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
@media (min-width: 760px) { .ticker { grid-template-columns: repeat(4, 1fr); } .ticker div { padding: 40px 8px; border-bottom: 0 !important; } .ticker div + div { border-left: 1px solid var(--rule); } .ticker div:nth-child(odd) { border-right: 0; } }

.circles { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.circles div { display: grid; gap: 6px; padding: 22px 0; border-bottom: 1px solid var(--rule); text-align: center; }
.circles b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
.circles span { font-size: 14.5px; color: var(--muted); }
@media (min-width: 900px) { .circles { grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--rule); } .circles div { border-bottom: 0; padding: 32px 18px; } .circles div + div { border-left: 1px solid var(--rule); } }

.rv { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
.rv.in { opacity: 1; transform: none; }

/* ---------- passports, lists, forms ---------- */
.item { display: grid; gap: 12px; }
.item-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.meta { font-size: 14.5px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.facts div { padding: 14px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.facts div:nth-child(odd) { padding-right: 14px; }
.facts div:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--rule); }
.facts span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.facts b { font-weight: 500; font-size: 16px; }
.kpi-row b { font-family: var(--display); font-size: 30px; font-weight: 400; line-height: 1.15; }

.story { border-left: 1px solid var(--rose); padding-left: 18px; font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1.5; }
.private { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 15px; border: 1px dashed var(--rule); padding: 14px 16px; }
.private svg { width: 20px; height: 20px; flex: none; }

.kpis { display: grid; gap: 0; border-block: 1px solid var(--rule); }
.kpi { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 36px 16px; }
.kpi + .kpi { border-top: 1px solid var(--rule); }
@media (min-width: 760px) { .kpis.grid3 { gap: 0; } .kpi + .kpi { border-top: 0; border-left: 1px solid var(--rule); } }
.kpi b { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 6vw, 68px); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.kpi b small { font-family: var(--body); font-size: 18px; margin-left: 6px; }
.kpi span { font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.kpi em { font-style: normal; font-size: 14px; color: var(--ok); min-height: 1.5em; }
.kpi.bump { animation: bump 1.2s ease; }
@keyframes bump { 0%, 100% { background: transparent; } 30% { background: var(--ok-soft); } }

.rows { display: grid; }
.rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: 15.5px; }
.rows > div:last-child { border-bottom: 0; }
.rows b { font-weight: 500; }
.rows .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

form { display: grid; gap: 20px; }
.field { display: grid; gap: 8px; }
.field label, .field > span:first-child { font-size: 11.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.field .hint { font-size: 14px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 0; border: 1px solid var(--rule); background: var(--card); font-size: 17px; }
.field input:focus, .field select:focus { border-color: var(--ink); outline: none; }
.err { color: var(--rose); font-size: 14.5px; min-height: 1.2em; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--rule); cursor: pointer; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.checks input { width: 18px; height: 18px; accent-color: var(--ink); }
.checks label:has(input:checked) { border-color: var(--ink); }

.seg { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.seg button { flex: none; min-height: 46px; padding: 8px 20px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 15px; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.lesson-pt { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 6px 0; }
.lesson-pt i { font-family: var(--display); font-style: italic; font-size: 26px; color: var(--rose); line-height: 1.1; }
.opts { display: grid; gap: 10px; }
.opts button { min-height: 56px; text-align: left; padding: 12px 16px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 16.5px; }
.opts button:hover { border-color: var(--ink); }
.opts button.wrong { border-color: var(--rose); background: var(--rose-soft); }
.opts button.right { border-color: var(--ok); background: var(--ok-soft); }

.qrwrap { display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; }
.qrbox { background: #fff; padding: 8px; }
.qrbox svg { width: 100%; height: auto; display: block; }
.url { font-family: var(--mono); font-size: 11.5px; word-break: break-all; color: var(--muted); }
.tags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .tags.grid5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

/* ---------- motion: buttons ---------- */
:root { --ease: cubic-bezier(.22, .8, .24, 1); }
/* A fill sweeps in from the left on hover; the label stays on top */
.btn { position: relative; overflow: hidden; isolation: isolate; transition: color .45s var(--ease), border-color .45s var(--ease), transform .2s var(--ease); }
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ink); transform: scaleX(0); transform-origin: right; transition: transform .55s var(--ease); }
.btn:hover { background: transparent; color: var(--bg); }
.btn:hover::before { transform: scaleX(1); transform-origin: left; }
.btn.rose::before { background: var(--rose); }
.btn.rose:hover { background: var(--ink); border-color: var(--rose); color: var(--rose-ink); }
.btn.ok::before { display: none; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.ok { animation: settle .5s var(--ease); }
@keyframes settle { from { transform: scale(.96); opacity: .6; } }

/* Text links: the underline draws itself */
.link { text-decoration: none; background: linear-gradient(currentColor, currentColor) left calc(50% + 12px) / 0 1px no-repeat, linear-gradient(var(--rule), var(--rule)) left calc(50% + 12px) / 100% 1px no-repeat; transition: background-size .5s var(--ease); }

/* Entry tiles: heading opens up, the cue slides an arrow in */

.entry i::after { content: "→"; display: inline-block; margin-left: 0; opacity: 0; max-width: 0; transform: translateX(-6px); transition: all .45s var(--ease); }

.entry:active { transform: scale(.99); }

/* Product cards: the name gets an underline */

/* ---------- motion: text ---------- */

.strip a:nth-child(3) .pic { animation-delay: .65s; }
/* Sections that scroll in: children arrive one after another */
.rv > * { opacity: 0; transform: translateY(16px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.rv.in > * { opacity: 1; transform: none; }

.rv { opacity: 1; transform: none; }

/* Confirmation tick draws itself */

/* Headline words rise in one by one; labels and intro text fade up after them */
function animateText() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const h = document.querySelector("main .h1");
  if (h) {
    h.setAttribute("aria-label", h.textContent.trim());
    let i = 0;
    const walk = node => [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.append(part); return; }
          const w = document.createElement("span"), inner = document.createElement("span");
          w.className = "w"; w.setAttribute("aria-hidden", "true");
          inner.style.setProperty("--i", i++); inner.textContent = part;
          w.append(inner); frag.append(w);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1) walk(n);
    });
    walk(h);
  }
  [[".crumbs", 0], [".hero .label, .page-head .label", 0], [".hero .lead, .page-head .lead", 450]].forEach(([sel, d]) =>
    document.querySelectorAll(sel).forEach(el => { el.classList.add("fade-up"); el.style.setProperty("--d", d + "ms"); }));
}

/* Impact numbers count up from zero the first time they are seen */
function countUp(el) {
  const t = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.textContent));
  if (!t) return;
  const target = parseFloat(t.textContent.replace(/,/g, ""));
  if (!(target > 0) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const start = performance.now(), dur = 1400;
  const step = now => {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    t.textContent = fmt(Math.round(target * e));
    if (p < 1) requestAnimationFrame(step); else t.textContent = fmt(target);
  };
  requestAnimationFrame(step);
}

/* Gentle fade-in as sections scroll into view */
let revealer = null;
function reveal() {
  const els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) { els.forEach(el => el.classList.add("in")); return; }
  if (revealer) revealer.disconnect();
  revealer = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    en.target.classList.add("in");
    if (en.target.matches(".ticker")) en.target.querySelectorAll("b").forEach(countUp);
    revealer.unobserve(en.target);
  }), { rootMargin: "0px 0px -8% 0px" });
  els.forEach(el => revealer.observe(el));
  document.querySelectorAll(".kpis .kpi b").forEach(countUp);
}

function route() {
  const h = (location.hash || "#home").slice(1);
  const [name, ...rest] = h.split("-");
  const arg = rest.join("-");
  let html;
  switch (name) {
    case "trainer": html = viewTrainer(); break;
    case "maker": html = viewMaker(arg || S.me); break;
    case "matches": html = viewMatches(); break;
    case "lessons": html = viewLessons(); break;
    case "lesson": html = viewLessons(arg); break;
    case "garments": html = viewGarments(); break;
    case "garment": html = viewGarment(arg); break;
    case "donate": html = viewDonate(); break;
    case "dashboard": html = viewDashboard(); break;
    default: html = viewHome();
  }
  $("app").innerHTML = html;
  animateText();
  reveal();
  $("head").innerHTML = header(NAV_FOR[name] || "home");
  setMenu(false);
  $("foot").innerHTML = footer();
  if (S.flash) { S.flash = null; save(); }
  window.scrollTo(0, 0);
}
function setMenu(open) {
  $("head").classList.toggle("open", open);
  document.body.classList.toggle("menu-open", open);
  const b = $("head").querySelector(".menu-btn");
  if (b) { b.setAttribute("aria-expanded", open); b.setAttribute("aria-label", open ? "Close menu" : "Open menu"); b.innerHTML = icon(open ? "close" : "menu"); }
}
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
window.addEventListener("hashchange", route);

/* ============================================================
   SHEETS (confirmation messages)
   ============================================================ */
function sheet(title, body, btn = "Done", next = "") {
  $("sheet-root").innerHTML = `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <span class="done-ico">${icon("check")}</span><h2 class="h2" id="sh-t">${title}</h2><p>${body}</p>
    <button class="btn rose" data-act="close-sheet" data-next="${next}">${btn}</button>
    ${next ? `<button class="btn line" data-act="close-sheet">Stay here</button>` : ""}
  </div></div>`;
  $("sheet-root").querySelector(".btn").focus();
}
function scanSheet() {
  $("sheet-root").innerHTML = `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <span class="done-ico" style="background:var(--rose-soft);color:var(--rose)">${icon("scan")}</span>
    <h2 class="h2" id="sh-t">Scan a garment</h2>
    <p>Open your phone camera and point it at the QR code on the garment's tag. The Garment Passport opens by itself.</p>
    <p class="label" style="margin-top:4px">No tag nearby? Pick a garment</p>
    <div class="stack" style="gap:8px">${Object.entries(GARMENTS).map(([id, g]) => `<button class="btn line sm" style="justify-content:space-between" data-act="close-sheet" data-next="garment-${id}"><span>${esc(g.name)}</span><span class="small" style="font-family:var(--mono)">${id.toUpperCase()}</span></button>`).join("")}</div>
    <button class="btn" data-act="close-sheet">Close</button>
  </div></div>`;
}

/* ============================================================
   ACTIONS
   ============================================================ */
document.addEventListener("click", e => {
  if (e.target.closest(".site-nav, .mobile-nav")) setMenu(false);
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === "close-sheet") {
    if (a.classList.contains("sheet-bg") && e.target !== a) return;
    $("sheet-root").innerHTML = "";
    if (a.dataset.next) go(a.dataset.next);
    return;
  }
  if (act === "back") { if (history.length > 1) history.back(); else go("home"); }
  if (act === "scan") scanSheet();
  if (act === "menu") setMenu(!$("head").classList.contains("open"));
  if (act === "tsel") { S.trainerSel = id; save(); route(); }
  if (act === "verify") {
    const b = S.makers[id].badges[+a.dataset.i];
    b.verified = true; b.by = TRAINER; b.date = today();
    if (!S.makers[id].skills.includes(b.skill)) S.makers[id].skills.push(b.skill);
    save(); route();
    sheet("Badge verified", `“${esc(b.name)}” is now verified on ${esc(S.makers[id].name)}'s Maker Passport.`, "See passport", `maker-${id}`);
  }
  if (act === "me") { S.me = id; save(); go(`maker-${id}`); }
  if (act === "book") {
    const x = MENTORS.find(m => m.id === id);
    S.booked[id] = true; S.flash = "hours"; save(); route();
    sheet(`Booked with ${x.name}`, `Your first session is on ${x.slot}. ${x.name} will meet you at your workshop. One mentoring hour has been added to the impact dashboard.`);
  }
  if (act === "contact") {
    const x = JOBS.find(j => j.id === id);
    S.contacted[id] = true; save(); route();
    sheet("Request sent", `We sent ${esc(S.makers[S.me].name)}'s Maker Passport to the ${x.org.split(",")[0].toLowerCase()} for the ${x.title.toLowerCase()} role. They will reply through your trainer.`);
  }
  if (act === "answer") {
    const l = LESSONS.find(x => x.id === a.dataset.l), i = +a.dataset.i;
    if (S.lessons[l.id]) return;
    if (i !== l.answer) { a.classList.add("wrong"); $("ans-msg").textContent = "Not quite. Read the three points again and try once more."; return; }
    a.classList.add("right");
    const m = S.makers[S.me];
    S.lessons[l.id] = true;
    m.badges.push({ name: l.badge, skill: "Money basics", verified: true, by: "Lesson quiz", date: today() });
    const newSkill = !m.skills.includes("Money basics");
    if (newSkill) m.skills.push("Money basics");
    S.flash = l.badge; save();
    setTimeout(() => sheet("New badge earned", `<b>${esc(l.badge)}</b> is now on your Maker Passport.${newSkill ? " You also gained the skill <b>Money basics</b>, which gives you a new mentor match." : ""}`, "See my passport", `maker-${S.me}`), 350);
  }
  if (act === "buy") {
    S.reserved[id] = true; save(); route();
    sheet("Reserved for you", `${esc(GARMENTS[id].name)} is held for 48 hours. We'll send payment and delivery details by email. Your purchase pays ${esc(S.makers[GARMENTS[id].maker].name)}'s wage at the workshop.`, "Donate fabric next", "donate");
  }
  if (act === "reset") { S = fresh(); save(); route(); sheet("Demo reset", "Everything is back to the starting sample data."); }
});

document.addEventListener("change", e => {
  if (e.target.dataset.act === "consent") {
    const m = S.makers[e.target.dataset.id];
    m.consent = e.target.checked; save();
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "donate-form") {
    const brand = $("d-brand").value.trim(), kg = parseFloat($("d-kg").value);
    if (!brand) { $("d-err").textContent = "Please add your brand name."; $("d-brand").focus(); return; }
    if (!(kg > 0)) { $("d-err").textContent = "Please add how many kg you're donating, for example 40."; $("d-kg").focus(); return; }
    const d = { brand, type: $("d-type").value, kg, pickup: $("d-pick").value, date: today() };
    S.donations.push(d); S.flash = "kg"; save();
    sheet(`Thank you, ${esc(brand)}`, `${fmt(kg)} kg of ${esc(d.type.toLowerCase())} is booked for pickup at: ${esc(d.pickup)}. We added it to the impact dashboard.`, "See impact dashboard", "dashboard");
  }
  if (f.id === "maker-form") {
    const name = $("m-name").value.trim();
    if (!/^[A-Za-z\u00C0-\u00FF'-]{2,20}$/.test(name)) { $("m-err").textContent = name.includes(" ") ? "Please use a first name only, with no surname." : "Please enter a first name of 2 to 20 letters."; return; }
    const skills = [...f.querySelectorAll('input[name="sk"]:checked')].map(x => x.value);
    if (!skills.length) { $("m-err").textContent = "Choose at least one skill."; return; }
    const id = name.toLowerCase().replace(/[^a-z]/g, "") + Date.now().toString(36).slice(-3);
    const colors = ["#7A4E9E", "#2F6A8F", "#8F6A2F", "#2F8F6A", "#9E2348"];
    S.makers[id] = { name: name[0].toUpperCase() + name.slice(1), color: colors[S.newMakers % colors.length], since: new Date().toLocaleDateString("en-GB", { month: "long", year: "numeric" }), workshop: $("m-ws").value,
      about: "New maker at The Rose.", skills, badges: [], consent: false, story: "" };
    S.newMakers++; S.trainerSel = id; save(); route();
    sheet("Profile created", `${esc(S.makers[id].name)}'s Maker Passport is ready. Their story stays private until they choose to share it.`, "Open passport", `maker-${id}`);
  }
  if (f.id === "badge-form") {
    const sel = S.trainerSel && S.makers[S.trainerSel] ? S.trainerSel : Object.keys(S.makers)[0];
    const name = $("b-name").value.trim(); if (!name) return;
    const skill = $("b-skill").value, m = S.makers[sel];
    m.badges.push({ name, skill, verified: true, by: TRAINER, date: today() });
    if (!m.skills.includes(skill)) m.skills.push(skill);
    save(); route();
    sheet("Badge added", `“${esc(name)}” is verified on ${esc(m.name)}'s passport.`);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("sheet-root").innerHTML) $("sheet-root").innerHTML = ""; });

route();
</script>
